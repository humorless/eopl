<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="'Noto Sans CJK TC', 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Mnemonic for EOPL p.63 notation: my own picture, not from the book -->
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <!-- upper layer -->
  <rect x="10" y="10" width="940" height="120" rx="8" fill="#eef4fb" stroke="#4a90d9"/>
  <text x="26" y="40" font-size="22" fill="#1a1a2e">上層：defined language（LET）的值，ExpVal</text>
  <rect x="120" y="60" width="220" height="52" rx="6" fill="#fff" stroke="#555"/>
  <text x="230" y="94" font-size="24" text-anchor="middle" font-family="monospace">(num-val 3)</text>
  <rect x="600" y="60" width="240" height="52" rx="6" fill="#fff" stroke="#555"/>
  <text x="720" y="94" font-size="24" text-anchor="middle" font-family="monospace">(bool-val #t)</text>
  <!-- lower layer -->
  <rect x="10" y="270" width="940" height="120" rx="8" fill="#f6f6f6" stroke="#888"/>
  <text x="26" y="378" font-size="22" fill="#1a1a2e">下層：defining language（Racket）的值</text>
  <rect x="120" y="288" width="220" height="52" rx="6" fill="#fff" stroke="#555"/>
  <text x="230" y="322" font-size="24" text-anchor="middle" font-family="monospace">3</text>
  <rect x="600" y="288" width="240" height="52" rx="26" fill="#fff" stroke="#b33" stroke-dasharray="6 4"/>
  <text x="720" y="322" font-size="24" text-anchor="middle" fill="#b33">報錯</text>
  <!-- ceiling: up -->
  <line x1="190" y1="286" x2="190" y2="116" stroke="#333" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="178" y="205" font-size="24" text-anchor="end">⌈ ⌉  num-val</text>
  <!-- floor: down -->
  <line x1="270" y1="114" x2="270" y2="284" stroke="#333" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="284" y="205" font-size="24">⌊ ⌋  expval-&gt;num</text>
  <!-- floor on a boolean: error -->
  <line x1="720" y1="114" x2="720" y2="284" stroke="#b33" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#ah)"/>
  <text x="734" y="205" font-size="24" fill="#b33">⌊ ⌋  expval-&gt;num</text>
</svg>
