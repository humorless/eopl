<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 1200 500" font-family="Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d9822b"/>
    </marker>
  </defs>
  <rect y="40" width="1200" height="500" fill="#ffffff"/>

  <!-- lane labels -->
  <text x="20" y="72" font-size="22" font-weight="bold" fill="#1a1a2e">C</text>
  <text x="20" y="282" font-size="22" font-weight="bold" fill="#1a1a2e">Lisp</text>
  <line x1="20" y1="215" x2="1180" y2="215" stroke="#ddd" stroke-width="1.5"/>

  <!-- ===== C lane (center y = 130) ===== -->
  <rect x="40" y="100" width="150" height="60" rx="6" fill="#f2f2f2" stroke="#888" stroke-width="1.5"/>
  <text x="115" y="137" font-size="18" text-anchor="middle" fill="#333">原始碼（文字）</text>

  <line x1="190" y1="130" x2="245" y2="130" stroke="#666" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="250" y="95" width="190" height="70" rx="12" fill="#fdebd3" stroke="#d9822b" stroke-width="2.5"/>
  <text x="345" y="124" font-size="18" text-anchor="middle" font-weight="bold" fill="#8a4b0f">preprocessor</text>
  <text x="345" y="150" font-size="16" text-anchor="middle" fill="#8a4b0f">C macro：token 替換</text>

  <line x1="440" y1="130" x2="495" y2="130" stroke="#666" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="500" y="100" width="150" height="60" rx="6" fill="#f2f2f2" stroke="#888" stroke-width="1.5"/>
  <text x="575" y="137" font-size="18" text-anchor="middle" fill="#333">替換後的文字</text>

  <line x1="650" y1="130" x2="775" y2="130" stroke="#666" stroke-width="2" marker-end="url(#ar)"/>
  <text x="712" y="120" font-size="16" text-anchor="middle" fill="#555">parse</text>

  <rect x="780" y="100" width="150" height="60" rx="6" fill="#e6f0fa" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="855" y="137" font-size="18" text-anchor="middle" fill="#1a1a2e">語法樹</text>

  <line x1="930" y1="130" x2="1015" y2="130" stroke="#666" stroke-width="2" marker-end="url(#ar)"/>
  <text x="972" y="120" font-size="16" text-anchor="middle" fill="#555">compile</text>

  <rect x="1020" y="100" width="150" height="60" rx="6" fill="#f2f2f2" stroke="#888" stroke-width="1.5"/>
  <text x="1095" y="137" font-size="18" text-anchor="middle" fill="#333">機器碼</text>

  <!-- ===== Racket lane (center y = 400) ===== -->
  <rect x="40" y="370" width="150" height="60" rx="6" fill="#f2f2f2" stroke="#888" stroke-width="1.5"/>
  <text x="115" y="407" font-size="18" text-anchor="middle" fill="#333">原始碼（文字）</text>

  <line x1="190" y1="400" x2="245" y2="400" stroke="#666" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="250" y="365" width="190" height="70" rx="12" fill="#ffffff" stroke="#888" stroke-width="1.5"/>
  <text x="345" y="394" font-size="18" text-anchor="middle" font-weight="bold" fill="#333">read</text>
  <text x="345" y="420" font-size="14" text-anchor="middle" fill="#666">'x 讀成 (quote x)</text>

  <line x1="440" y1="400" x2="495" y2="400" stroke="#666" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="500" y="370" width="150" height="60" rx="6" fill="#e6f0fa" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="575" y="407" font-size="18" text-anchor="middle" fill="#1a1a2e">語法樹</text>

  <!-- expand loop -->
  <path d="M 620 370 C 625 300, 525 300, 530 366" fill="none" stroke="#d9822b" stroke-width="2.5" marker-end="url(#aro)"/>
  <rect x="440" y="250" width="270" height="62" rx="12" fill="#fdebd3" stroke="#d9822b" stroke-width="2.5"/>
  <text x="575" y="276" font-size="18" text-anchor="middle" font-weight="bold" fill="#8a4b0f">expand：Lisp macro</text>
  <text x="575" y="300" font-size="15" text-anchor="middle" fill="#8a4b0f">語法樹 → 語法樹，直到沒有 macro</text>

  <line x1="650" y1="400" x2="775" y2="400" stroke="#666" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="780" y="365" width="150" height="70" rx="6" fill="#e6f0fa" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="855" y="395" font-size="18" text-anchor="middle" fill="#1a1a2e">展開後的語法樹</text>
  <text x="855" y="420" font-size="14" text-anchor="middle" fill="#555">只剩核心語法</text>

  <line x1="930" y1="390" x2="1015" y2="355" stroke="#666" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="930" y1="410" x2="1015" y2="445" stroke="#666" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="1020" y="320" width="150" height="56" rx="6" fill="#ffffff" stroke="#4a90d9" stroke-width="2"/>
  <text x="1095" y="345" font-size="17" text-anchor="middle" fill="#1a1a2e">直譯</text>
  <text x="1095" y="366" font-size="14" text-anchor="middle" fill="#555">value-of 的位置</text>

  <rect x="1020" y="425" width="150" height="56" rx="6" fill="#ffffff" stroke="#888" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="1095" y="450" font-size="17" text-anchor="middle" fill="#333">編譯</text>
  <text x="1095" y="471" font-size="14" text-anchor="middle" fill="#555">下學期</text>

  <!-- legend -->
  <rect x="40" y="510" width="22" height="16" fill="#f2f2f2" stroke="#888"/>
  <text x="70" y="523" font-size="15" fill="#333">文字</text>
  <rect x="130" y="510" width="22" height="16" fill="#e6f0fa" stroke="#4a90d9"/>
  <text x="160" y="523" font-size="15" fill="#333">語法樹</text>
  <rect x="235" y="510" width="22" height="16" fill="#fdebd3" stroke="#d9822b"/>
  <text x="265" y="523" font-size="15" fill="#333">macro 作用的地方：C 在 parse 之前替換 token，Lisp 在 read 之後改語法樹</text>
</svg>
