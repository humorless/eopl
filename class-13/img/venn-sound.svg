<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" font-family="Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- all programs -->
  <rect x="10" y="10" width="980" height="480" rx="16" fill="#f4f4f4" stroke="#888" stroke-width="2"/>
  <text x="30" y="44" font-size="24" fill="#333">所有程式</text>
  <!-- safe -->
  <ellipse cx="400" cy="275" rx="350" ry="195" fill="#dbe9f8" stroke="#4a90d9" stroke-width="3"/>
  <text x="400" y="118" font-size="22" fill="#1f5fa8" text-anchor="middle">safe：執行時不會發生 type error</text>
  <!-- accepted -->
  <ellipse cx="300" cy="300" rx="205" ry="118" fill="#d8f0d8" stroke="#3a9a3a" stroke-width="3"/>
  <text x="300" y="218" font-size="22" fill="#2a7a2a" text-anchor="middle">分析接受</text>
  <!-- programs in accepted -->
  <g font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="17" fill="#222">
    <circle cx="140" cy="275" r="6" fill="#2a7a2a"/><text x="152" y="281">proc (x) (x 3)</text>
    <circle cx="140" cy="315" r="6" fill="#2a7a2a"/><text x="152" y="321">proc (f) proc (x) (f x)</text>
    <circle cx="140" cy="355" r="6" fill="#2a7a2a"/><text x="152" y="361">letrec f(x) = (f -(x,-1))</text>
    <text x="152" y="383">in (f 1)</text>
    <!-- safe but rejected -->
    <circle cx="510" cy="200" r="6" fill="#1f5fa8"/><text x="522" y="206">proc (x) (3 x)</text>
    <circle cx="510" cy="400" r="6" fill="#1f5fa8"/><text x="522" y="406">let f = 3 in proc (x) (f x)</text>
    <!-- unsafe -->
    <circle cx="735" cy="70" r="6" fill="#b03030"/><text x="747" y="76">if 3 then 88 else 99</text>
    <circle cx="735" cy="460" r="6" fill="#b03030"/><text x="747" y="466">let x = 4 in (x 3)</text>
  </g>
  <!-- callouts -->
  <g font-size="19" fill="#333">
    <text x="780" y="230">藍色環狀區：</text>
    <text x="780" y="256">safe，但分析拒絕</text>
    <text x="780" y="282">（conservative 的代價）</text>
    <text x="780" y="330">sound：綠圈沒有</text>
    <text x="780" y="356">任何部分在藍圈外</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
