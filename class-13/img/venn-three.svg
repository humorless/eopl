<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 400" font-family="Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <clipPath id="outSafe">
      <!-- everything except the safe ellipse of panel 3 -->
      <path clip-rule="evenodd" d="M700,40 H1040 V330 H700 Z M870,190 m-140,0 a140,110 0 1,0 280,0 a140,110 0 1,0 -280,0 Z"/>
    </clipPath>
  </defs>
  <!-- panel 1 -->
  <g>
    <rect x="10" y="40" width="330" height="290" rx="12" fill="#f4f4f4" stroke="#888" stroke-width="2"/>
    <text x="175" y="28" font-size="22" text-anchor="middle" fill="#222">① 有用的 sound 分析</text>
    <ellipse cx="175" cy="190" rx="140" ry="110" fill="#dbe9f8" stroke="#4a90d9" stroke-width="3"/>
    <ellipse cx="160" cy="200" rx="105" ry="78" fill="#d8f0d8" stroke="#3a9a3a" stroke-width="3"/>
    <text x="160" y="207" font-size="20" fill="#2a7a2a" text-anchor="middle">接受</text>
    <text x="175" y="365" font-size="18" text-anchor="middle" fill="#333">綠圈在藍圈裡，而且夠大</text>
  </g>
  <!-- panel 2 -->
  <g>
    <rect x="360" y="40" width="330" height="290" rx="12" fill="#f4f4f4" stroke="#888" stroke-width="2"/>
    <text x="525" y="28" font-size="22" text-anchor="middle" fill="#222">② 沒用的 sound 分析</text>
    <ellipse cx="525" cy="190" rx="140" ry="110" fill="#dbe9f8" stroke="#4a90d9" stroke-width="3"/>
    <text x="525" y="197" font-size="18" fill="#2a7a2a" text-anchor="middle">接受：空集合</text>
    <text x="525" y="365" font-size="18" text-anchor="middle" fill="#333">拒絕所有程式，仍然 sound</text>
  </g>
  <!-- panel 3 -->
  <g>
    <rect x="710" y="40" width="330" height="290" rx="12" fill="#f4f4f4" stroke="#888" stroke-width="2"/>
    <text x="875" y="28" font-size="22" text-anchor="middle" fill="#222">③ unsound 的分析</text>
    <ellipse cx="870" cy="190" rx="140" ry="110" fill="#dbe9f8" stroke="#4a90d9" stroke-width="3"/>
    <ellipse cx="938" cy="200" rx="95" ry="75" fill="#d8f0d8" stroke="#3a9a3a" stroke-width="3"/>
    <ellipse cx="938" cy="200" rx="95" ry="75" fill="#f2b8b8" stroke="#b03030" stroke-width="3" clip-path="url(#outSafe)"/>
    <text x="910" y="207" font-size="20" fill="#2a7a2a" text-anchor="middle">接受</text>
    <text x="875" y="365" font-size="18" text-anchor="middle" fill="#333">紅色：被接受，執行時卻有 type error</text>
  </g>
  <text x="525" y="392" font-size="15" text-anchor="middle" fill="#666">灰框：所有程式　藍圈：safe　綠圈：分析接受</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
